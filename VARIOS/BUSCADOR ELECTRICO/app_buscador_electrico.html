<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscador Eléctrico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#222;min-height:100vh}
h1{background:#1a3a5c;color:#fff;padding:14px 20px;font-size:1.1em;display:flex;justify-content:space-between;align-items:center}
.btn-nueva{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.75em;font-weight:700}
.btn-nueva:hover{background:rgba(255,255,255,.15)}
.contenido{padding:18px;max-width:720px;margin:0 auto}
.caja-clave{background:#fff8e1;border:1px solid #f0c040;border-radius:8px;padding:14px;margin-bottom:16px}
.caja-clave input{width:100%;padding:8px;border:1px solid #bcd;border-radius:6px;font-size:.9em;margin-top:6px}
.hilo{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.msg{border-radius:8px;padding:14px 16px;line-height:1.65;white-space:pre-wrap}
.msg-usuario{background:#eaf1fb;border:1px solid #b0c8e0;align-self:flex-end;max-width:88%}
.msg-ia{background:#fff;border:1px solid #dce8f5;max-width:100%}
.aviso-general{background:#f0f4ff;border-left:4px solid #6690c4;padding:10px 14px;font-size:.85em;margin-bottom:10px;border-radius:0 6px 6px 0}
.fuentes{margin-top:14px;padding-top:12px;border-top:1px solid #dce8f5}
.fuentes-titulo{font-size:.78em;font-weight:700;color:#555;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.fuente-cita{background:#f7fafc;border:1px solid #dce8f5;border-left:3px solid #1a3a5c;border-radius:0 6px 6px 0;padding:10px 12px;margin-bottom:8px}
.fuente-cita-libro{color:#1a3a5c;font-weight:700;font-size:.78em;margin-bottom:4px}
.fuente-cita-texto{font-style:italic;color:#444;font-size:.85em;line-height:1.5}
.fuente-imagen{margin-top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fuente-imagen img{max-width:280px;border:1px solid #d0d5dd;border-radius:6px}
.fuente-imagen label{font-size:.8em;color:#555;display:flex;align-items:center;gap:6px}
.caja-pregunta{background:#fff;border:1px solid #dce8f5;border-radius:8px;padding:16px}
.caja-pregunta label{display:block;margin-bottom:6px;font-size:.85em;color:#444;font-weight:700}
textarea{width:100%;padding:10px;border:1px solid #bcd;border-radius:6px;font-size:.95em;font-family:inherit;height:70px;resize:vertical}
.btn-preguntar{background:#1a3a5c;color:#fff;border:none;padding:11px 24px;border-radius:6px;cursor:pointer;font-size:.95em;font-weight:700;margin-top:10px}
.btn-preguntar:disabled{background:#8fa8c0;cursor:wait}
.oculta{display:none}
.error{background:#fdedec;color:#b03a2e;border:1px solid #f1948a;border-radius:8px;padding:14px;margin-bottom:16px}
.pensando{color:#666;font-style:italic;padding:14px 16px}
.btn-imprimir{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.75em;font-weight:700;margin-right:8px}
.btn-imprimir:hover{background:rgba(255,255,255,.15)}
.h1-botones{display:flex;gap:0}
.letterhead-impresion{display:none}
@page{size:A4 portrait;margin:14mm 14mm}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  body{background:#fff!important}
  h1,.caja-clave,.caja-pregunta,.error,.pensando{display:none!important}
  .contenido{padding:0!important;max-width:none!important;margin:0!important}
  .letterhead-impresion{display:block!important;break-inside:avoid;page-break-inside:avoid}
  .ih{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #1a3a5c;padding-bottom:10px;margin-bottom:10px}
  .titulo-informe{background:linear-gradient(135deg,#1a3a5c 78%,#16697a);color:#fff;padding:9px 14px;font-weight:700;font-size:.95em;margin-bottom:10px;letter-spacing:.06em;border-left:5px solid #27ae60;border-radius:0 4px 4px 0}
  .fecha-informe{text-align:right;font-size:.78em;color:#555;margin-bottom:0}
  .hilo{display:block;margin-bottom:0}
  .msg{border:none!important;border-radius:0!important;margin:0!important;max-width:none!important}
  .msg-usuario{background:transparent!important;padding:10px 0 2px!important;font-weight:700;color:#1a3a5c;break-inside:avoid;page-break-inside:avoid;page-break-after:avoid;break-after:avoid}
  .msg-usuario::before{content:"Pregunta: "}
  .msg-ia{padding:2px 0 4px!important;break-inside:avoid;page-break-inside:avoid}
  .msg-ia img,.msg-ia .grafico,.msg-ia table{break-inside:avoid;page-break-inside:avoid}
  .fuentes,.fuente-cita,.fuente-imagen{display:none!important}
  #imagenes-para-imprimir{display:block!important}
  #imagenes-para-imprimir img{max-width:100%;margin-bottom:12px;break-inside:avoid}
}
</style>
</head>

  Buscador Eléctrico

    <button class="btn-imprimir oculta" id="btnImprimir">Imprimir informe</button>
    <button class="btn-nueva oculta" id="btnNueva">Nueva pregunta</button>
  </span>
</h1>
<div class="contenido">

    <label for="inputClave"><strong>Contraseña de acceso</strong> (se guarda en este dispositivo, no hace falta escribirla cada vez)</label>
    <input type="password" id="inputClave" placeholder="Contraseña">
  </div>

  <div class="error oculta" id="cajaError"></div>

  <div class="hilo" id="hilo"></div>

  <div class="caja-pregunta">
    <label id="labelPregunta" for="inputPregunta">Pregunta técnica</label>
    <textarea id="inputPregunta" placeholder="Ej: ¿Qué sección de cable necesito para una línea de 25A?"></textarea>
    <button class="btn-preguntar" id="btnPreguntar">Preguntar</button>
  </div>

</div>

<script>
const URL_WORKER = "https://buscador-electrico-spike.buscador-electrico-worker.workers.dev";

const inputClave = document.getElementById("inputClave");
const cajaClave = document.getElementById("cajaClave");
const inputPregunta = document.getElementById("inputPregunta");
const labelPregunta = document.getElementById("labelPregunta");
const btnPreguntar = document.getElementById("btnPreguntar");
const btnNueva = document.getElementById("btnNueva");
const btnImprimir = document.getElementById("btnImprimir");
const cajaError = document.getElementById("cajaError");
const hilo = document.getElementById("hilo");
const fechaInforme = document.getElementById("fechaInforme");

// Conversación en curso (null = todavía no se ha hecho ninguna pregunta en
// este hilo). Se guarda solo en memoria de esta pestaña, no en localStorage
// — cada pregunta nueva empieza su propio hilo.
let conversacionActual = null;
let indiceFuente = 0;

const claveGuardada = localStorage.getItem("buscadorElectricoClave");
if (claveGuardada) {
  inputClave.value = claveGuardada;
  cajaClave.classList.add("oculta");
}

// Formato ligero por si el texto trae **negrita** pese a las instrucciones
// del prompt — no es un renderizador de Markdown completo a propósito,
// solo cubre el caso más habitual sin añadir ninguna librería nueva.
function formatearTexto(texto) {
  return texto
    .replace(/</g, "&lt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function escaparHtml(texto) {
  return texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function mostrarError(mensaje) {
  cajaError.textContent = mensaje;
  cajaError.classList.remove("oculta");
  cajaError.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function ocultarError() {
  cajaError.classList.add("oculta");
}

function añadirMensajeUsuario(texto) {
  const div = document.createElement("div");
  div.className = "msg msg-usuario";
  div.textContent = texto;
  hilo.appendChild(div);
  return div;
}

function añadirMensajePensando() {
  const div = document.createElement("div");
  div.className = "msg pensando";
  div.textContent = "Pensando... puede tardar hasta 2 minutos si la pregunta necesita cálculos.";
  hilo.appendChild(div);
  return div;
}

function añadirMensajeIA(datos) {
  const div = document.createElement("div");
  div.className = "msg msg-ia";
  let html = "";
  if (datos.encontradoEnLibros === false && datos.fuentes && datos.fuentes.length === 0 && !conversacionActual) {
    html += '<div class="aviso-general">Esto no lo he encontrado en tus libros — es conocimiento general de la IA.</div>';
  }
  html += formatearTexto(datos.respuesta);
  if (datos.fuentes && datos.fuentes.length > 0) {
    html += '<div class="fuentes"><div class="fuentes-titulo">Fragmentos consultados (para que compruebes lo dicho arriba — no sale en el informe impreso):</div>';
    for (const f of datos.fuentes) {
      html += '<div class="fuente-cita">';
      html += `<div class="fuente-cita-libro">${escaparHtml(f.libro)} (pág. ${f.paginas.join(", ")})</div>`;
      if (f.texto) {
        html += `<div class="fuente-cita-texto">"${escaparHtml(f.texto)}"</div>`;
      }
      if (f.imagenes && f.imagenes.length > 0) {
        f.imagenes.forEach((imagenB64, idxImagen) => {
          const idCasilla = `incluir-img-${indiceFuente}-${idxImagen}`;
          html += '<div class="fuente-imagen">';
          html += `<img src="data:image/png;base64,${imagenB64}" alt="Diagrama de ${escaparHtml(f.libro)}, página ${f.paginas.join(", ")}">`;
          html += `<label><input type="checkbox" id="${idCasilla}" class="casilla-informe-imagen" data-src="data:image/png;base64,${imagenB64}"> Incluir en el informe</label>`;
          html += "</div>";
        });
      }
      html += "</div>";
      indiceFuente++;
    }
    html += "</div>";
  }
  div.innerHTML = html;
  hilo.appendChild(div);
}

function nuevaPregunta() {
  conversacionActual = null;
  hilo.innerHTML = "";
  inputPregunta.value = "";
  labelPregunta.textContent = "Pregunta técnica";
  btnNueva.classList.add("oculta");
  btnImprimir.classList.add("oculta");
  ocultarError();
  inputPregunta.focus();
}

function imprimirInforme() {
  fechaInforme.textContent = new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });

  const marcadas = [...document.querySelectorAll(".casilla-informe-imagen:checked")];
  const contenedorImpresion = document.createElement("div");
  contenedorImpresion.id = "imagenes-para-imprimir";
  contenedorImpresion.style.display = "none";
  marcadas.forEach((casilla) => {
    const img = document.createElement("img");
    img.src = casilla.dataset.src;
    img.style.maxWidth = "100%";
    contenedorImpresion.appendChild(img);
  });
  document.querySelector(".contenido").appendChild(contenedorImpresion);

  window.print();

  contenedorImpresion.remove();
}

async function preguntar() {
  const pregunta = inputPregunta.value.trim();
  const clave = inputClave.value.trim();

  if (!clave) {
    mostrarError("Escribe la contraseña de acceso primero.");
    return;
  }
  if (!pregunta) {
    mostrarError("Escribe una pregunta.");
    return;
  }

  const burbujaPregunta = añadirMensajeUsuario(pregunta);
  inputPregunta.value = "";
  btnPreguntar.disabled = true;
  btnPreguntar.textContent = "Pensando...";
  ocultarError();
  const elementoPensando = añadirMensajePensando();
  // Si la pregunta no llega a contestarse, se devuelve al recuadro para reintentar con un clic
  // (y no queda en el hilo, ni en el informe impreso, una pregunta sin respuesta).
  const deshacerEnvio = () => {
    burbujaPregunta.remove();
    inputPregunta.value = pregunta;
  };

  const cuerpo = { pregunta, clave };
  if (conversacionActual) {
    cuerpo.conversacion = conversacionActual;
  }

  try {
    const resp = await fetch(URL_WORKER, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo),
    });
    const datos = await resp.json();

    if (!resp.ok) {
      deshacerEnvio();
      if (datos.error === "no_autorizado") {
        mostrarError("Contraseña incorrecta.");
      } else if (datos.error === "ia_no_responde") {
        mostrarError(datos.detalle || "El servicio de IA no responde ahora mismo. Prueba de nuevo en unos minutos.");
      } else if (datos.error === "indice_no_disponible") {
        mostrarError(datos.detalle || "El índice de libros no está disponible ahora mismo. Avisa a Bixente para revisarlo.");
      } else {
        mostrarError("Ha ocurrido un error inesperado: " + (datos.error || resp.status));
      }
      return;
    }

    localStorage.setItem("buscadorElectricoClave", clave);
    cajaClave.classList.add("oculta");
    añadirMensajeIA(datos);
    conversacionActual = datos.conversacion || null;
    if (conversacionActual) {
      labelPregunta.textContent = "¿Le falta algún dato a la IA, o tienes otra duda sobre esto? Responde aquí:";
      btnNueva.classList.remove("oculta");
      btnImprimir.classList.remove("oculta");
    }
  } catch (error) {
    deshacerEnvio();
    mostrarError("No se ha podido conectar con el buscador. Comprueba tu conexión a internet.");
  } finally {
    elementoPensando.remove();
    btnPreguntar.disabled = false;
    btnPreguntar.textContent = "Preguntar";
  }
}

btnPreguntar.addEventListener("click", preguntar);
btnNueva.addEventListener("click", nuevaPregunta);
btnImprimir.addEventListener("click", imprimirInforme);
inputPregunta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) preguntar();
});
</script>
</body>
</html>
