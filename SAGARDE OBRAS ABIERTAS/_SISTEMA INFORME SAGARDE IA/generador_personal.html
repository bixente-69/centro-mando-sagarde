<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
    <title>Personal en obra</title>
    <link rel="manifest" href="personal_manifest.json" />
    <link rel="apple-touch-icon" href="personal_icono_apple.png" />
    <meta name="theme-color" content="#0b1f3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Personal en obra" />
    <style>
      /* ---- Horario propio: estilos del editor y selector de horario específico por trabajador ---- */
      /* Estos estilos van antes del bloque principal por historia; se deja el orden porque la
         cascada (qué regla gana a igualdad de especificidad) depende de él
       */
      .chip.propio {
        background: #e3efff;
        color: #1f5fa8;
      }
      .row .sub {
        flex-basis: 100%;
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .hpb {
        min-height: 48px;
        padding: 0 8px;
        font-size: 14px;
        font-weight: 600;
        background: none;
        border: 0;
        color: #1f5fa8;
        text-decoration: underline;
      }
      .sub .hpb {
        margin-left: auto;
      }
      .hp {
        flex-basis: 100%;
        border-top: 1px dashed var(--line);
        margin-top: 2px;
        padding-top: 10px;
      }
      .hp .nota {
        margin: 4px 0 0;
      }
      .hp .hor label {
        color: var(--muted);
      }
      .hp input {
        min-height: 48px;
        font-size: 16px;
        text-align: center;
        padding: 6px;
      }
      .hp .actions .btn {
        flex: 1;
      }
      /* ---- Variables de color y estilos base: paleta de colores del tema y estilos generales ---- */
      :root {
        --bg: #f4f6f9;
        --card: #fff;
        --header: #0b1f3a;
        --text: #1c2733;
        --muted: #647184;
        --accent: #f5a524;
        --ok: #2e9e5b;
        --warn: #e07b1a;
        --line: #d8dce4;
        --tabs-h: calc(57px + env(safe-area-inset-top));
        --barra-h: calc(68px + env(safe-area-inset-bottom));
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input,
      select {
        font: inherit;
      }
      /* ---- Pestañas: navegación superior fija y segmentos de selección de vista ---- */
      .tabs {
        position: sticky;
        top: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: var(--tabs-h);
        padding: calc(6px + env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .tabs .seg {
        flex: 1;
        min-width: 0;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 10px max(10px, env(safe-area-inset-right)) 10px max(10px, env(safe-area-inset-left));
      }
      .view:not(#v-app) {
        max-width: 760px;
        margin-left: auto;
        margin-right: auto;
      }
      .view[hidden] {
        display: none;
      }
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .seg button {
        flex: 1;
        border: 0;
        background: #fff;
        padding: 10px;
        min-height: 44px;
      }
      .seg button + button {
        border-left: 1px solid var(--line);
      }
      .seg button.on {
        background: var(--header);
        color: #fff;
        font-weight: 700;
      }
      button[data-amb] {
        min-height: 48px;
      }
      /* ---- Barra superior y tarjetas: cabecera con degradado, origen de datos y contenedores ---- */
      .bar {
        background: linear-gradient(135deg, #0b1f3a, #123a63);
        color: #fff;
        padding: 15px;
        border-radius: 14px 14px 0 0;
        display: flex;
        justify-content: space-between;
        font-weight: 700;
      }
      .bar-estado {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        text-align: right;
        max-width: 66%;
      }
      .bar-estado small {
        font-size: 12px;
        font-weight: 600;
        line-height: 1.3;
      }
      .pad,
      .card {
        background: #fff;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 12px;
        box-shadow: 0 1px 3px #0b1f3a15;
      }
      .pad {
        border-radius: 0 0 14px 14px;
      }
      .origin {
        background: var(--header);
        color: #cbd7e5;
        padding: 0 15px 10px;
        font-size: 12px;
      }
      .fld {
        display: block;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        margin: 12px 0 4px;
      }
      select,
      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #fff;
      }
      /* ---- Botones: estilos primarios, secundarios, fantasma y variantes de tamaño ---- */
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 14px;
        min-height: 52px;
        font-weight: 700;
      }
      .pri {
        background: var(--accent);
      }
      .sec {
        background: var(--header);
        color: #fff;
      }
      .ghost {
        background: #fff;
        border: 1px solid var(--line);
      }
      .sm {
        min-height: 44px;
        padding: 7px 10px;
      }
      /* ---- Chips: selectores rápidos de fecha y contenedores flexibles de acciones ---- */
      .chips,
      .actions,
      .ctl {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .chips .on {
        background: var(--header);
        color: #fff;
      }
      /* ---- Lista de presentes: filas de trabajadores, botón de asistencia y control de horas ---- */
      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px;
        margin: 8px 0;
      }
      .row.off {
        opacity: 0.58;
      }
      .x {
        width: 56px;
        height: 56px;
        min-width: 56px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ok);
        font-size: 24px;
        font-weight: 800;
      }
      .x.on {
        background: #e8f6ee;
        border-color: var(--ok);
      }
      .x:not(.on) {
        color: transparent;
      }
      .nm {
        flex: 1;
        min-width: 80px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .step {
        display: flex;
        align-items: center;
        margin-left: auto;
      }
      .step button {
        width: 48px;
        height: 48px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 9px;
        font-size: 20px;
      }
      .step output {
        min-width: 50px;
        text-align: center;
        font-weight: 700;
      }
      .step output.falta {
        color: var(--warn);
        font-size: 13px;
      }
      .chip {
        font-size: 11px;
        font-weight: 700;
        background: #fff1d6;
        color: #9a5b00;
        padding: 3px 7px;
        border-radius: 20px;
      }
      .add {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 7px;
      }
      /* ---- Avisos y resumen: mensajes de alerta, confirmaciones y contador de jornadas pendientes ---- */
      .aviso {
        background: #fff7e0;
        border: 1px solid #f1d58a;
        border-radius: 10px;
        padding: 10px;
        margin: 8px 0;
      }
      .aviso > button {
        float: right;
        border: 0;
        background: none;
        font-size: 20px;
        min-width: 44px;
        min-height: 44px;
        margin: -10px -10px -10px 6px;
      }
      /* Aviso de antes de guardar y resumen de lo guardado: lista de frases y botones a todo el ancho */
      .aviso-guardar {
        border-left: 4px solid #d9822b;
      }
      .aviso-guardar ul,
      #resumen-guardado ul {
        margin: 6px 0;
        padding-left: 20px;
      }
      .aviso-guardar li,
      #resumen-guardado li {
        margin: 4px 0;
      }
      .aviso-guardar .actions .btn {
        flex: 1 1 100%;
      }
      .sum {
        font-weight: 700;
        margin: 14px 0;
      }
      .full {
        width: 100%;
      }
      .pending {
        background: #fff7e0;
        padding: 10px;
        border-radius: 10px;
        margin: 10px 0;
      }
      /* ---- Horarios y jornadas: cuadrícula de horario semanal y tarjetas de jornadas anteriores ---- */
      details {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin: 12px 0;
      }
      .hor {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        margin-top: 8px;
        text-align: center;
        font-size: 12px;
      }
      .jor-item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px;
        margin: 8px 0;
      }
      .jor-item.pendiente {
        border-left: 5px solid var(--accent);
      }
      .jor-item h3 {
        margin: 0;
        font-size: 15px;
      }
      .muted,
      .nota {
        font-size: 12px;
        color: var(--muted);
      }
      /* ---- Informe y tabla: tabla resumen de horas y barras de porcentaje de impacto ---- */
      .wrapx {
        max-width: 100%;
      }
      table.data {
        border-collapse: collapse;
        width: 100%;
        table-layout: fixed;
        font-size: 11px;
      }
      table.data th,
      table.data td {
        padding: 7px 2px;
        border-bottom: 1px solid #edf0f4;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      table.data th {
        font-size: 10px;
        color: var(--muted);
        text-align: left;
        vertical-align: bottom;
      }
      table.data th:first-child,
      table.data td:first-child {
        width: 27%;
      }
      .periodo {
        font-weight: 700;
        margin: 12px 0 4px;
      }
      .n {
        text-align: right;
      }
      /* ---- Informe: la empresa junto al nombre y la tabla «Por empresa» ---- */
      .nom-emp {
        display: block;
        word-break: normal;
        overflow-wrap: normal;
        font-size: 10px;
        color: var(--muted);
        line-height: 1.2;
      }
      .emp-titulo {
        margin: 18px 0 4px;
        font-size: 14px;
      }
      table.emp-tabla {
        border-collapse: collapse;
        width: 100%;
        table-layout: fixed;
        font-size: 11px;
      }
      table.emp-tabla th,
      table.emp-tabla td {
        padding: 7px 2px;
        border-bottom: 1px solid #edf0f4;
        overflow-wrap: break-word;
      }
      .emp-bloque {
        margin-bottom: 12px;
      }
      table.emp-tabla th {
        font-size: 10px;
        color: var(--muted);
        text-align: left;
        vertical-align: bottom;
      }
      table.emp-tabla th:first-child,
      table.emp-tabla td:first-child {
        width: 30%;
      }
      table.emp-tabla tr.emp-sin td {
        color: var(--muted);
      }
      table.emp-tabla tfoot td {
        border-top: 2px solid #cfd6e0;
        border-bottom: 0;
        font-weight: 700;
      }
      table.emp-tabla tfoot tr.emp-total-aut td {
        border-top: 1px dashed #cfd6e0;
        font-style: italic;
        font-weight: 600;
      }
      .impacto {
        display: grid;
        grid-template-columns: 90px 1fr 50px;
        gap: 6px;
        align-items: center;
        margin: 7px 0;
        font-size: 13px;
      }
      .ib {
        height: 15px;
        background: #e8edf4;
        border-radius: 10px;
        overflow: hidden;
      }
      .ib i {
        display: block;
        height: 100%;
        background: #2e7dd7;
      }
      .impacto.top i {
        background: var(--accent);
      }
      /* ---- Utilidades y diseño adaptable: notificaciones flotantes toast y reglas responsive ---- */
      #toast {
        pointer-events: none;
        position: fixed;
        left: 50%;
        bottom: calc(var(--barra-h) + 12px);
        transform: translateX(-50%);
        background: var(--header);
        color: #fff;
        padding: 12px;
        border-radius: 10px;
        opacity: 0;
        z-index: 20;
        max-width: 92vw;
      }
      #toast.on {
        opacity: 1;
      }
      /* ---- Corregir nombres y varios nombres: lápiz, campo de edición y cuadro de varios nombres ---- */
      .nw {
        flex: 1;
        min-width: 96px;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .nw .nm {
        flex: 1;
        min-width: 0;
      }
      .lap {
        flex: none;
        width: 44px;
        min-height: 44px;
        border: 0;
        background: none;
        font-size: 20px;
        color: #1f5fa8;
      }
      .row.ren input,
      .row.ren select {
        flex-basis: 100%;
      }
      /* La empresa va en pequeño debajo del nombre (al lado no cabe en un móvil): el nombre y la empresa ocupan una
         columna y el lápiz queda a la derecha de las dos. */
      .nw.con-emp {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        min-width: 150px;
      }
      .nw.con-emp .nm {
        grid-column: 1;
        grid-row: 1;
      }
      .nw.con-emp .emp {
        grid-column: 1;
        grid-row: 2;
        font-size: 12px;
        line-height: 1.2;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .nw.con-emp .lap {
        grid-column: 2;
        grid-row: 1 / span 2;
      }
      .row.ren .actions,
      .row.ren .aviso {
        flex-basis: 100%;
        margin: 0;
      }
      .row.ren .actions .btn {
        flex: 1;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #fff;
        font: inherit;
        resize: vertical;
      }
      .varios {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin: 10px 0;
      }
      .varios .nota {
        margin: 4px 0 8px;
      }
      .varios .actions .btn {
        flex: 1;
      }
      #varios-resumen div[data-res] {
        margin: 6px 0;
      }
      /* ---- Enviar al PC: para qué sirve, lo que hay sin enviar por obra, pasos y recuadro «Listo» ---- */
      .envio {
        border: 1px solid var(--line);
        border-left: 5px solid var(--accent);
        border-radius: 10px;
        padding: 11px;
        margin: 10px 0;
      }
      .envio h3 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .envio ul {
        margin: 0 0 10px;
        padding-left: 18px;
      }
      .envio li {
        margin: 4px 0;
      }
      .envio .btn + .btn {
        margin-top: 8px;
      }
      .pasos {
        margin: 10px 0;
        padding-left: 22px;
      }
      .pasos li {
        margin: 6px 0;
      }
      .listo {
        background: #e6f5ec;
        border: 1px solid #9fd3b4;
        border-radius: 10px;
        padding: 12px;
        margin: 10px 0;
        font-weight: 700;
      }
      /* ---- Bandeja: todo lo que está sin enviar al PC, línea a línea, con «Quitar» ---- */
      .band-obra {
        border: 1px solid var(--line);
        border-left: 5px solid var(--accent);
        border-radius: 10px;
        padding: 11px;
        margin: 10px 0;
      }
      .band-obra h3 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .band-obra ul {
        margin: 0 0 4px;
        padding-left: 0;
        list-style: none;
      }
      .band-item {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 10px;
        margin: 8px 0;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }
      .band-item:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .band-texto {
        flex: 1 1 220px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .band-igual {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 8px;
        border: 1px solid #9fd3b4;
        border-radius: 8px;
        background: #e6f5ec;
        font-size: 13px;
        font-weight: 700;
      }
      .band-bloqueo {
        flex: 1 1 100%;
        margin: 0;
      }
      .rotulo {
        background: #e8f0fb;
        border: 1px solid #b9cfee;
        border-radius: 10px;
        padding: 10px;
        margin: 10px 0;
      }
      .btn-volver-portal {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--header);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        justify-content: center;
        flex: none;
        width: 44px;
        padding: 0;
        border-radius: 8px;
        margin: 0;
        min-height: 44px;
      }
      .btn-volver-portal:active {
        background: #123a63;
      }
      /* Enlace al calendario de Sagarde (todas las obras y el ranking): va en la misma fila que la fecha, por eso es corto */
      .enlace-cal {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 6px 14px;
        font-size: 15px;
        line-height: 1.2;
        color: var(--header);
        text-decoration: none;
        white-space: nowrap;
      }
      .criterio-busqueda {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }
      .criterio-busqueda select {
        flex: 0 0 135px;
        min-height: 46px;
      }
      .criterio-busqueda input {
        flex: 1;
      }
      .cal-box {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px;
        margin: 10px 0;
      }
      .cal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .cal-head .nav-cal {
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 18px;
        cursor: pointer;
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        text-align: center;
      }
      .cal-sem {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        padding: 4px 0;
      }
      .cal-vacio {
        min-height: 44px;
      }
      .cal-dia {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
      }
      /* Día con algo guardado en la obra y el ámbito que se ven (en el PC o solo en este aparato): fondo verde claro y un
         punto, para que no dependa solo del color. Va antes de .hoy y .on, que mandan sobre él. */
      .cal-dia.tiene {
        background: #dcf3e5;
      }
      .cal-dia.tiene::after {
        content: '';
        position: absolute;
        top: 4px;
        right: 4px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #1f7a43;
      }
      .cal-dia.hoy {
        border: 2px solid var(--accent);
      }
      .cal-dia.on {
        background: var(--header);
        color: #fff;
        border-color: var(--header);
        font-weight: 700;
      }
      .cal-dia.on.tiene::after {
        background: #fff;
      }
      .cal-leyenda {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .cal-leyenda span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .cal-leyenda .muestra {
        position: relative;
        flex: none;
        width: 16px;
        height: 16px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
      }
      .cal-leyenda .muestra.tiene {
        background: #dcf3e5;
      }
      .cal-leyenda .muestra.tiene::after {
        content: '';
        position: absolute;
        top: 2px;
        right: 2px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #1f7a43;
      }
      .dias-marcados {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px dashed var(--line);
        font-size: 12px;
      }
      .dias-marcados .chip {
        background: #e3efff;
        color: #1f5fa8;
        font-size: 12px;
        padding: 3px 8px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .dias-marcados .chip button {
        border: 0;
        background: none;

    <div id="toast" role="status"></div>
    <script>
      'use strict';
      // ---------------------------------------------------------------------------
      // Almacenamiento: lectura y escritura en localStorage y definición de claves K
      // ---------------------------------------------------------------------------
      const LS = 'sgd_personal_',
        K = {
          e: LS + 'estado',
          p: LS + 'pendientes',
          b: LS + 'borrador',
          n: LS + 'nuevos',
          h: LS + 'horarios',
          x: LS + 'excepciones',
          a: LS + 'aviso_instalar',
          r: LS + 'rotos',
          rn: LS + 'renombres',
          al: LS + 'altas',
          em: LS + 'empresas',
          uh: LS + 'ultimas_horas',
          ob: LS + 'ultima_obra',
          cn: LS + 'sin_compartir',
          ap: LS + 'aparato',
        };
      // Textos de cobertura (en llano; los tres primeros los aprobó Bixente).
      const COB = {
        con: "Con cobertura: datos al día",
        sin: "Sin cobertura: usando la lista del {fecha}",
        sinFecha: "Sin cobertura: usando la lista guardada",
        nada: "Sin datos todavía: abre la tablet una vez con cobertura",
        nadaTitulo: "Todavía no hay lista de obras ni de trabajadores",
        informe: "Informe necesita cobertura la primera vez. Lo demás sigue funcionando: puedes anotar y enviar.",
        sinLista: "Jornadas sin enviar: {n}. Están a salvo en la tablet. Necesitas cobertura para cargar la lista y poder seguir.",
        sinPreparar: "Para usar la tablet sin cobertura, primero tienes que abrirla una vez con cobertura.",
      };
      // Lee y parsea un valor JSON de localStorage; devuelve el valor por defecto d si no existe o
      // falla
      function get(k, d) {
        try {
          let v = localStorage.getItem(k);
          return v === null ? d : JSON.parse(v);
        } catch (e) {
          return d;
        }
      }
      // Texto que tenía guardado en el aparato cada clave la última vez que ESTA pestaña la leyó o la
      // escribió. Sirve para enterarse de si otra pestaña de la misma tablet ha guardado algo desde
      // entonces (ver releerSiOtraPestanaGuardo).
      const vistos = {};
      // Serializa a JSON y guarda un valor en localStorage; devuelve true si tuvo éxito o false si
      // falló
      function set(k, v) {
        try {
          let texto = JSON.stringify(v);
          localStorage.setItem(k, texto);
          vistos[k] = texto;
          return true;
        } catch (e) {
          return false;
        }
      }
      // Borra una clave de localStorage sin fallar si el aparato no deja.
      function del(k) {
        try {
          localStorage.removeItem(k);
        } catch (e) {}
      }
      // ---------------------------------------------------------------------------
      // Utilidades: funciones de formato, fechas, redondeo y validadores
      // ---------------------------------------------------------------------------
      const clean = (s) => (typeof s === 'string' ? s.trim().replace(/\s+/g, ' ') : ''),
        key = (s) =>
          clean(s)
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase(),
        E = (s) =>
          String(s ?? '').replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
          ),
        N = (x) => (Math.round(+x * 10) / 10).toString().replace('.', ','),
        HK = ['dom', 'lun', 'mar', 'mie', 'jue', 'vie', 'sab'];
      // Redondeo a 2 decimales: evita el ruido de coma flotante que el PC rechazaría.
      function R(x) {
        return Math.round(x * 100) / 100;
      }
      function today() {
        let d = new Date(),
          z = (n) => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
      }
      // Suma n días a una fecha AAAA-MM-DD y devuelve otra fecha AAAA-MM-DD.
      function add(f, n) {
        let p = f.split('-').map(Number),
          d = new Date(p[0], p[1] - 1, p[2] + n),
          z = (x) => String(x).padStart(2, '0');
        return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
      }
      // Día de la semana de una fecha (0 = domingo … 6 = sábado), igual que Date.getDay().
      function dow(f) {
        let p = f.split('-').map(Number);
        return new Date(p[0], p[1] - 1, p[2]).getDay();
      }
      // Fecha AAAA-MM-DD que existe de verdad (rechaza, por ejemplo, el 30 de febrero).
      function fechaOk(f) {
        return /^\d{4}-\d{2}-\d{2}$/.test(f) && add(f, 0) === f;
      }
      // Valida que una lista de trabajadores sea un array de objetos con nombre (texto), on
      // (booleano) y horas válidas
      function listaOk(l) {
        return (
          Array.isArray(l) &&
          l.every(
            (x) =>
              x &&
              typeof x === 'object' &&
              typeof x.nombre === 'string' &&
              typeof x.on === 'boolean' &&
              (x.horas === null || (typeof x.horas === 'number' && Number.isFinite(x.horas))),
          )
        );
      }
      // Valida la estructura completa de una jornada guardada: obra, ámbito, fecha real, anulada y
      // lista de presentes
      function jornadaOk(j) {
        return (
          !!j &&
          typeof j === 'object' &&
          typeof j.obra === 'string' &&
          ['vivienda', 'garaje'].includes(j.ambito) &&
          fechaOk(j.fecha) &&
          typeof j.anulada === 'boolean' &&
          Array.isArray(j.presentes) &&
          j.presentes.every(
            (x) =>
              x &&
              typeof x === 'object' &&
              typeof x.nombre === 'string' &&
              typeof x.horas === 'number' &&
              Number.isFinite(x.horas) &&
              (x.extra === undefined || (typeof x.extra === 'number' && Number.isFinite(x.extra))),
          )
        );
      }
      // Valida un nombre de trabajador y devuelve el motivo si no es válido o cadena vacía si vale
      function motivoNombre(nombre) {
        let s = clean(nombre);
        if (s.length > 60) return 'tiene más de 60 letras';
        if (/[\u0000-\u001f\u007f-\u009f]/.test(s)) return 'lleva caracteres raros';
        if (/[<>]/.test(s)) return 'lleva los signos < o >';
        const DNI = /(^|[^A-Za-z0-9])\d{8}[- ]?[A-Za-z](?![A-Za-z0-9])/;
        const NIE = /(^|[^A-Za-z0-9])[XYZxyz][- ]?\d{7}[- ]?[A-Za-z](?![A-Za-z0-9])/;
        const TELEFONO = /(^|[^\d.])(?:\+?34[\s.-]?)?[6789](?:[\s.-]?\d){8}(?!\d)/;
        const CORREO = /[^\s@"']+@[^\s@"']+\.[^\s@"']+/;
        if (DNI.test(s)) return 'parece un DNI';
        if (NIE.test(s)) return 'parece un NIE';
        if (TELEFONO.test(s)) return 'parece un teléfono';
        if (CORREO.test(s)) return 'parece un correo';
        return '';
      }
      // ---------------------------------------------------------------------------
      // Estado y reconciliación: estado publicado, pendientes, borrador, horarios propios y
      // reconcile
      // ---------------------------------------------------------------------------
      // Leyenda de abreviaturas: a = estado de pantalla (vista, obra, ámbito, fecha, lista), K =
      // claves localStorage, E = escapar HTML, N = formato número con coma, R = redondeo a 2
      // decimales, hor = horario de obra, cat = catálogo, pub = jornadas publicadas, jk = clave
      // única obra|ámbito|fecha.
      let state = null,
        origin = '',
        datosDe = '',
        pending = [],
        news = [],
        hours = {},
        excepciones = {},
        renombres = [],
        altas = [],
        empresas = [],
        publicados = new Set(),
        rotos = 0;
      // Las siete listas que guarda este aparato. Otra pestaña de la MISMA tablet comparte este
      // almacenamiento: antes cada pestaña las leía una sola vez al abrir y luego las escribía
      // enteras desde memoria, y la que guardaba la última borraba lo que había guardado la otra.
      const CLAVES_LISTAS = [K.p, K.n, K.h, K.x, K.rn, K.al, K.em];
      // Lee las siete listas del aparato y las deja limpias en memoria. Se llama al abrir y cada vez
      // que otra pestaña ha guardado algo (ver releerSiOtraPestanaGuardo).
      function cargarDelAparato() {
        pending = get(K.p, []);
        news = get(K.n, []);
        hours = get(K.h, {});
        excepciones = get(K.x, {});
        renombres = get(K.rn, []);
        altas = get(K.al, []);
        empresas = get(K.em, []);
        CLAVES_LISTAS.forEach((k) => {
          try {
            vistos[k] = localStorage.getItem(k);
          } catch (e) {
            vistos[k] = null;
          }
        });
        if (!Array.isArray(pending)) pending = [];
        // Vigilante de integridad: separa las jornadas pendientes válidas de las dañadas en
        // localStorage
        let pendientesBuenos = pending.filter((j) => jornadaOk(j));
        let pendientesRotos = pending.filter((j) => !jornadaOk(j));
        rotos += pendientesRotos.length;
        // Aparta las jornadas corruptas en sgd_personal_rotos (K.r) para no perder datos ni
        // bloquear la app
        if (pendientesRotos.length) {
          let anteriores = get(K.r, []);
          if (!Array.isArray(anteriores)) anteriores = [];
          set(K.r, anteriores.concat(pendientesRotos));
          pending = pendientesBuenos;
          set(K.p, pending);
        }
        news = Array.isArray(news) ? news.filter((x) => typeof x === 'string') : [];
        renombres = Array.isArray(renombres)
          ? renombres.filter(
              (r) =>
                r &&
                typeof r === 'object' &&
                typeof r.de === 'string' &&
                clean(r.de) &&
                typeof r.a === 'string' &&
                clean(r.a),
            )
          : [];
        altas = Array.isArray(altas) ? altas.filter((x) => typeof x === 'string' && clean(x)) : [];
        // Empresas apuntadas en este aparato: { nombre, empresa }; empresa vacía = quitársela.
        empresas = Array.isArray(empresas)
          ? empresas.filter(
              (e) => e && typeof e === 'object' && typeof e.nombre === 'string' && clean(e.nombre) && typeof e.empresa === 'string',
            )
          : [];
        if (!hours || typeof hours !== 'object' || Array.isArray(hours)) hours = {};
        excepciones = limpiarExcepciones(excepciones);
        set(K.x, excepciones);
      }
      // Antes de cada acción: si otra pestaña de esta tablet ha guardado algo en las siete listas
      // desde la última vez que ESTA las leyó o las escribió, trae primero lo nuevo, para que lo
      // que se guarde ahora se SUME a lo de la otra y no lo pise. Devuelve true si trajo algo.
      function releerSiOtraPestanaGuardo() {
        let cambio = false;
        try {
          cambio = CLAVES_LISTAS.some((k) => localStorage.getItem(k) !== (k in vistos ? vistos[k] : null));
        } catch (e) {
          return false;
        }
        if (!cambio) return false;
        let rotasAntes = rotos;
        cargarDelAparato();
        // Si lo que trajo la otra pestaña incluye jornadas que no se pueden leer, se apartan (como al arrancar) y se AVISA:
        // nada se descarta en silencio.
        let nuevasRotas = rotos - rotasAntes;
        if (iniciada && nuevasRotas > 0)
          toast(
            nuevasRotas === 1
              ? 'Se ha apartado 1 jornada guardada que no se puede leer'
              : 'Se han apartado ' + nuevasRotas + ' jornadas guardadas que no se pueden leer',
          );
        return true;
      }
      // Objeto «llano»: ni null ni lista.
      function objetoSimple(valor) {
        return valor !== null && typeof valor === 'object' && !Array.isArray(valor);
      }
      // Limpia y valida los horarios propios guardados en este aparato: descarta a la persona
      // ENTERA si alguno de sus días no es válido (día inventado, hora no numérica o fuera de
      // 0-24).
      function limpiarExcepciones(valor) {
        let limpio = {};
        if (!objetoSimple(valor)) return limpio;
        Object.entries(valor).forEach(([obra, personas]) => {
          if (!objetoSimple(personas)) return;
          let personasLimpias = {};
          Object.entries(personas).forEach(([nombre, dias]) => {
            if (!objetoSimple(dias)) return;
            let diasLimpios = {};
            let valido = Object.entries(dias).every(([dia, hora]) => {
              if (
                !HK.includes(dia) ||
                typeof hora !== 'number' ||
                !Number.isFinite(hora) ||
                hora < 0 ||
                hora > 24
              )
                return false;
              diasLimpios[dia] = hora;
              return true;
            });
            if (valido) personasLimpias[nombre] = diasLimpios;
          });
          if (Object.keys(personasLimpias).length) limpio[obra] = personasLimpias;
        });
        return limpio;
      }
      cargarDelAparato();
      let a = {
        v: 'app',
        obra: '',
        amb: 'vivienda',
        fecha: today(),
        list: [],
        p: 'mes',
        ref: today(),
        scope: 'todo',
        confirm: null,
        warn: null,
        reset: false,
        hp: null,
        auto: false,
        ren: null,
        varios: null,
        nuevoError: '',
        homonimo: null,
        prefill: null,
        multiDia: false,
        listo: null,
        compartirAviso: null,
        aviso: null,
        guardado: null,
        listaDe: null,
      };
      // Memoria de UN repintado. Mientras se construye una pantalla nada cambia (las vistas solo leen),
      // así que el índice de nombres y las filas de todas las obras se calculan una sola vez y se tiran
      // al salir. Fuera de un repintado no hay memoria: guardar, anular o corregir un nombre cambian
      // los datos y la pantalla siguiente parte de cero, sin nada que invalidar.
      let memoria = null;
      function conMemoria(construir) {
        if (memoria) return construir();
        memoria = { nombres: null, filas: null };
        try {
          return construir();
        } finally {
          memoria = null;
        }
      }
      // ¿Es «nombre» un nombre ANTIGUO de alguien que el PC ya renombró? El PC guarda los anteriores en nombres_anteriores
      // («Manuel (Manueles)» pasó a «Manuel»): no es otra persona. Si hoy es el nombre de alguien, no cuenta como antiguo.
      // (Un nombre nuevo creado en este aparato antes del cambio se quedaba guardado y salía repetido en «Añadir de la base».)
      function esNombreAntiguoDelPC(nombre) {
        let clave = key(nombre);
        let catalogo = state?.catalogo || [];
        if (catalogo.some((c) => key(c.nombre) === clave)) return false;
        return catalogo.some((c) => Array.isArray(c.nombres_anteriores) && c.nombres_anteriores.some((x) => typeof x === 'string' && key(x) === clave));
      }
      // Nombres de trabajadores (publicados y nuevos creados) por su clave sin tildes ni mayúsculas.
      function indiceNombres() {
        if (memoria && memoria.nombres) return memoria.nombres;
        let m = new Map();
        (state?.catalogo || []).forEach((x) => m.set(key(x.nombre), x.nombre));
        news.forEach((x) => {
          if (!m.has(key(x)) && !esNombreAntiguoDelPC(x)) m.set(key(x), x);
        });
        if (memoria) memoria.nombres = m;
        return m;
      }
      // Devuelve la lista unificada y ordenada alfabéticamente de nombres de trabajadores
      // (publicados y nuevos creados)
      function cat() {
        return [...indiceNombres().values()].sort((x, y) => x.localeCompare(y, 'es'));
      }
      // Nombre tal como está en el catálogo o en los nuevos si coincide sin tildes ni mayúsculas;
      // si no, el nombre limpio.
      function canon(n) {
        return indiceNombres().get(key(n)) || clean(n);
      }
      // ---------------------------------------------------------------------------
      // Empresas: cada persona tiene una (o ninguna); se elige de una lista y se apunta para el PC
      // ---------------------------------------------------------------------------
      const OTRA_EMPRESA = '__otra__';
      // Empresa que el PC tiene publicada para ese nombre ('' = sin empresa).
      function empresaPublicada(nombre) {
        let persona = (state?.catalogo || []).find((x) => key(x.nombre) === key(nombre));
        return clean(persona?.empresa);
      }
      // Empresa de una persona: lo apuntado en este aparato manda sobre lo publicado.
      function empresaDe(nombre) {
        let apuntada = empresas.find((x) => key(x.nombre) === key(nombre));
        return apuntada ? clean(apuntada.empresa) : empresaPublicada(nombre);
      }
      // Empresas conocidas, sin repetir (sin tildes ni mayúsculas) y por orden alfabético: las del catálogo
      // publicado, las apuntadas aquí y «Sagarde», que siempre sale.
      function listaEmpresas() {
        let m = new Map();

      function similar(n, empresa = '') {

        return r.tipo === 'parecido' ? r.existente : null;

      function masUnaInicial(largo, corto) {

      // Qué hacer con un nombre recién escrito (lógica pura: sin pantalla ni reloj). Recibe el nombre, la empresa escrita
      // junto a él, las personas de la base [{ nombre, empresa, activo }] y los nombres de la lista de hoy. Devuelve
      // { tipo, existente }:

      //   mismo                → está (activo) y no hay conflicto de empresa: la escrita está vacía, es la misma o él no tiene
      //   otra_persona_posible → está (activo) con una empresa distinta de la escrita: hay que preguntar
      //   de_baja              → está, pero de baja: hay que preguntar
      function clasificarNombreEscrito({ nombre, empresa, base, enLista }) {
        const k = key(nombre);

        const lista = Array.isArray(enLista) ? enLista : [];

        const activos = iguales.filter((x) => x.activo !== false);
        // Con dos activos del mismo nombre se prefiere el de la empresa escrita.
        const activo = activos.find((x) => key(empresa) && key(x.empresa) === key(empresa)) || activos[0];

        }
        if (iguales.length) return { tipo: 'de_baja', existente: iguales[0].nombre };

          // nombre del otro con más palabras pero de empresas distintas (los nombres de la lista de hoy no tienen empresa).
          const candidatos = [...personas.map((x) => ({ nombre: x.nombre, empresa: x.empresa })), ...lista.filter((x) => !personas.some((p) => key(p.nombre) === key(x))).map((x) => ({ nombre: x }))];
          const parecido = candidatos.find((x) => {

      // Aviso de personas con el mismo nombre en la lista que publica el PC: la tablet solo puede enseñar a una de cada nombre.

            let jors = ob.jornadas || [];

      function inicioDeJornadas() {

        let primeroDelMesPasado = anio + '-' + String(mes).padStart(2, '0') + '-01';

      // Notifica un cambio en obra, ámbito o fecha: recarga la lista, guarda el borrador automático

      // ---------------------------------------------------------------------------
      // Corregir nombres: lápiz, cambios de nombre por pasar al PC y varios nombres a la vez
      // ---------------------------------------------------------------------------
      // Cambia de por final (comparando con key) en una lista de objetos con nombre y quita los repetidos
      // que resulten: de cada nombre repetido queda el que ya se llamaba final antes del cambio (si
      // ninguno, el primero). grupo(x) separa listas mezcladas, p. ej. por ámbito y fecha.
      function unirNombres(lista, de, final, grupo = () => '') {
        let yaEra = new Set(lista.filter((x) => key(x.nombre) === key(final)));
        lista.forEach((x) => {
          if (key(x.nombre) === key(de)) x.nombre = final;
        });
        let elegido = new Map();
        lista.forEach((x) => {
          let clave = grupo(x) + '|' + key(x.nombre);
          let otro = elegido.get(clave);
          if (!otro || (yaEra.has(x) && !yaEra.has(otro))) elegido.set(clave, x);
        });
        return lista.filter((x) => elegido.get(grupo(x) + '|' + key(x.nombre)) === x);
      }
      // Cambia de por final en una lista de textos y quita los repetidos (queda el primero).
      function unirTextos(lista, de, final) {
        let vistos = new Set();
        return lista
          .map((x) => (key(x) === key(de) ? final : x))
          .filter((x) => !vistos.has(key(x)) && vistos.add(key(x)));
      }
      // Cambia de por final en las claves de un objeto indexado por nombre; si ya hay una clave con el
      // nombre final, manda la que ya estaba.
      function renombrarClave(objeto, de, final) {
        let claveDe = Object.keys(objeto).find((clave) => key(clave) === key(de));
        if (claveDe === undefined) return;
        let valor = objeto[claveDe];
        delete objeto[claveDe];
        if (!Object.keys(objeto).some((clave) => key(clave) === key(final))) objeto[final] = valor;
      }
      // Cambia de por final en la copia que hay en memoria del estado publicado por el PC.
      function renombrarEnEstado(de, final) {
        if (!state) return;
        state.catalogo = unirNombres(state.catalogo || [], de, final);
        Object.values(state.obras || {}).forEach((obra) => {
          obra.jornadas = unirNombres(obra.jornadas || [], de, final, (fila) => fila.ambito + '|' + fila.fecha);
          ['vivienda', 'garaje'].forEach((ambito) => {
            let ultima = obra.ultima?.[ambito];
            if (ultima?.presentes) ultima.presentes = unirNombres(ultima.presentes, de, final);
          });

        });

      function lleva(nombre) {

      function olvidarRenombres() {
        renombres = renombres.filter((cambio) => {

      function apuntarRenombre(de, final) {

      function renombrar(de, nuevo, empresa) {

        let filaFinal = a.list.find((x) => key(x.nombre) === key(final) && x !== filaDe);

        });

        altas = unirTextos(altas, de, final);

        empresas = unirNombres(empresas, de, final);
        Object.values(excepciones).forEach((personas) => renombrarClave(personas, de, final));
        renombrarEnEstado(de, final);

          set(K.x, excepciones),

      // «Guardar» (y «Sí, son la misma persona» con confirmado = true): comprueba el nombre y la empresa elegidos,
      // pregunta si el nombre ya es de otra persona y, si todo va bien, lo corrige. Solo toca la empresa si se ha
      // cambiado en el desplegable.
      function guardarRenombre(confirmado) {
        if (!a.ren) return;
        let de = a.ren.nombre;
        let valor = clean(a.ren.valor);
        let motivo = valor ? motivoNombre(valor) : '';
        let otro = cat().find((n) => key(n) === key(valor) && key(n) !== key(de));
        let elegida = leerEmpresa(a.ren.empresa, a.ren.otra);
        let cambiaEmpresa = !elegida.error && key(elegida.empresa) !== key(empresaDe(de));
        a.ren.error = '';
        a.ren.pregunta = '';
        a.ren.ayuda = '';
        if (valor !== de && (!valor || motivo)) {

        } else if (elegida.error) {

        } else if (valor === de && !cambiaEmpresa) {

        } else if (valor !== de && otro && !confirmado) {

            'Ya hay un ' + conSuEmpresa(otro) + ' y estás corrigiendo a ' + conSuEmpresa(de) +

                  : '«' + de + '» se queda sin empresa. Queda apuntado para el PC.'

      // Líneas del resumen de «Añadir varios nombres»: una por cada cosa que haya (entran, ya estaban, se les pone

      function resumenVariosHTML(resumen) {

      // Una línea de «Añadir varios nombres»: el nombre y, si lleva coma, la empresa (lo que va tras la última

      function añadirVarios() {
        if (!a.varios) return;

        let porCorregir = [];

          let { texto, nombre, empresa } = partirLinea(linea);
          if (!nombre && !empresa) return;
          if (!nombre) {

            return;

          if (vistos.has(key(nombre))) return;
          vistos.add(key(nombre));

          let motivoEmpresa = !motivo && empresa ? motivoNombre(empresa) : '';
          let existente = cat().find((x) => key(x) === key(nombre));
          let parecido = motivo || motivoEmpresa || existente ? null : similar(nombre, canonEmpresa(empresa));
          if (motivo || motivoEmpresa) {

            porCorregir.push(texto);

      // ---------------------------------------------------------------------------

      // Reúne las jornadas de todas las obras (publicadas y pendientes) para verificar acumulados

      function filasSinMemoria() {

          pub(obra).forEach((fila) => {

      // ---------------------------------------------------------------------------
      // Antes de guardar: qué días merecen un aviso (lógica pura, sin pantalla)
      // ---------------------------------------------------------------------------
      // Dice qué avisos tiene cada día marcado antes de guardar: gente que se pisaría, fin de semana en una
      // obra sin horario ese día, día que aún no ha llegado y personas que se guardarían con 0 horas.
      //   entrada = { hoy, dias: [{ fecha, horarioObra, existente: null | { origen, personas }, nuevas, yaAnotado }] }
      //   (origen: 'sin_enviar' o 'en_el_pc'; personas y nuevas: [{ nombre, horas }]; yaAnotado, opcional: ese día ya
      //   tenía jornada y es el que se está corrigiendo, así que no se avisa de fin de semana ni de día futuro).
      // Devuelve { dias: [{ fecha, accion, origen, anteriores, finde, futuro, sinHoras, avisos }], hayAvisos, firma }.
      // accion: 'nuevo' (día vacío), 'igual' (ya estaba exactamente así) o 'sustituye' (pisaría a otra gente).
      // La firma cambia si cambia cualquier cosa de lo que se avisa: sirve para no guardar algo distinto de lo
      // que se enseñó.
      function planificarGuardado(entrada) {
        // Clave de un nombre: sin espacios de más, sin tildes y en minúsculas.
        const claveNombre = (nombre) =>
          String(nombre ?? '')
            .trim()
            .replace(/\s+/g, ' ')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase();
        // Persona y horas como un solo texto, para comparar listas sin importar el orden.
        const parDe = (persona) =>
          claveNombre(persona.nombre) +
          '|' +
          (Number.isFinite(persona.horas) ? Math.round(persona.horas * 100) / 100 : '?');
        const mismasPersonas = (izquierda, derecha) => {
          const x = izquierda.map(parDe).sort();
          const y = derecha.map(parDe).sort();
          return x.length === y.length && x.every((par, i) => par === y[i]);
        };

        const diaDeLaSemana = (fecha) => {
          const [anio, mes, dia] = fecha.split('-').map(Number);
          return new Date(Date.UTC(anio, mes - 1, dia)).getUTCDay();
        };

        const vistas = new Set();
        const dias = [];
        entrada.dias.forEach((dato) => {
          if (vistas.has(dato.fecha)) return;
          vistas.add(dato.fecha);
          const anteriores = ((dato.existente && dato.existente.personas) || []).map((persona) => persona.nombre);
          const hayGente = anteriores.length > 0;
          let accion = 'nuevo';
          if (hayGente) accion = mismasPersonas(dato.existente.personas, dato.nuevas) ? 'igual' : 'sustituye';
          const finde = !dato.yaAnotado && [0, 6].includes(diaDeLaSemana(dato.fecha)) && !(dato.horarioObra > 0);
          const futuro = !dato.yaAnotado && dato.fecha > entrada.hoy;
          const sinHoras = dato.nuevas
            .filter((persona) => typeof persona.horas !== 'number' || !Number.isFinite(persona.horas) || persona.horas <= 0)
            .map((persona) => persona.nombre);
          const avisos = [];
          if (accion === 'sustituye') avisos.push('ocupado');
          if (finde) avisos.push('finde');
          if (futuro) avisos.push('futuro');
          if (sinHoras.length) avisos.push('cero_horas');

            fecha: dato.fecha,
            accion,
            origen: hayGente ? dato.existente.origen : null,
            anteriores,
            finde,
            futuro,
            sinHoras,
            avisos,
            nuevas: dato.nuevas.map((persona) => [persona.nombre, persona.horas]),
          });
        });
        dias.sort((x, y) => (x.fecha < y.fecha ? -1 : x.fecha > y.fecha ? 1 : 0));
        const firma = JSON.stringify(dias.map((d) => [d.fecha, d.accion, d.avisos, d.anteriores, d.nuevas]));
        dias.forEach((d) => delete d.nuevas);
        return { dias, hayAvisos: dias.some((d) => d.avisos.length > 0), firma };
      }
      // Traduce lo que decide la persona ante el aviso ('seguir', 'saltar' o 'cancelar') en los días que se

      function aplicarDecision(plan, modo) {

            guardar: fechasCon(() => true),
            sustituidas: fechasCon((d) => d.accion === 'sustituye'),
            saltadas: [],
            cancelado: false,
          };
        if (modo === 'saltar')
          return {
            guardar: fechasCon((d) => d.accion !== 'sustituye'),
            sustituidas: [],
            saltadas: fechasCon((d) => d.accion === 'sustituye'),
            cancelado: false,
          };

      // Lo que se guardaría de cada persona presente en esa fecha: sus horas (o las de su horario de ese día si

      function presentesDelDia(presentes, f) {
        return presentes.map((persona) => {

          let horasPersona = R(persona.horas === null ? baseDia : persona.horas);
          return {
            nombre: persona.nombre,
            horas: horasPersona,
            extra: R(Math.max(0, horasPersona - baseDia)),

      }
      // Los datos que necesita planificarGuardado: por cada fecha, lo que esa obra y ese ámbito ya tienen anotado

      // El día del que salió la lista que se está viendo cuenta como vacío: cambiarlo es corregir lo que se ve, y
      // pedir confirmación en cada corrección sería ruido. Los demás días, que la lista no enseña, sí avisan.
      function diasParaPlan(fechas, presentes) {
        let delPc = new Map();
        pub().forEach((fila) => {
          if (fila.ambito !== a.amb || !fechas.includes(fila.fecha)) return;
          if (!delPc.has(fila.fecha)) delPc.set(fila.fecha, []);
          delPc.get(fila.fecha).push({ nombre: fila.nombre, horas: +fila.horas });

          // fin de semana ni de día futuro: eso ya se avisó cuando se anotó.
          let esLaAbierta = f === abierta;

          let horarioDelDia = Math.max(hor()[dow(f)], ...presentes.map((persona) => horarioDe(persona.nombre, f)));

            horarioObra: horarioDelDia,
            existente: esLaAbierta ? null : real,

      // «Guardar jornada» con nadie marcado. Si ese día no tiene nada guardado no hay nada que hacer; si ya tenía gente
      // (no vino nadie, o se fueron a otra obra) lo que se pide es dejarlo SIN nadie: antes de tocar nada se dice a quién
      // se quita y se espera la respuesta (decision = { modo: 'seguir', firma }, que llega desde el aviso; con la
      // respuesta de un aviso que ya cambió vuelve a avisar). Un día que solo existía en este aparato se borra; uno que
      // ya está en el PC se anota como anulado para que el PC lo quite al recibir el fichero (como «Anular» en Jornadas).
      function guardarSinNadie(decision) {
        let dias = diasElegidos()
          .map((fecha) => ({ fecha, guardada: jornadaGuardada(fecha) }))
          .filter((dia) => dia.guardada);
        if (!dias.length) return toast('No hay ninguna persona presente');
        let firma = JSON.stringify(dias.map((dia) => [dia.fecha, dia.guardada.nombres]));
        if (!decision || decision.modo !== 'seguir' || decision.firma !== firma) {
          a.guardado = null;
          a.aviso = { vaciar: true, firma, dias };
          render();
          document.querySelector('#aviso-guardar')?.scrollIntoView({ block: 'nearest' });

        }
        a.aviso = null;
        dias.forEach((dia) => {
          let jornada = {
            obra: a.obra,
            ambito: a.amb,
            fecha: dia.fecha,
            presentes: [],
            anulada: true,
            notas: '',
            registrado: new Date().toISOString(),
          };
          pending = pending.filter((guardada) => jk(guardada) !== jk(jornada));
          if (rowsKey(jornada).length) pending.push(jornada);
        });
        let guardado = set(K.p, pending);
        a.prefill = null;
        a.guardado = guardado
          ? dias.map((dia) => '↻ ' + fdia(dia.fecha) + ' se queda sin nadie: antes ' + conPunto(nombresCortos(dia.guardada.nombres)))
          : null;
        render();
        if (!guardado)
          return toast(

              'la jornada al PC para no perder lo apuntado.',

      // Valida y guarda la jornada en pendientes de localStorage: exige las horas en los días sin
      // horario, rechaza si alguien pasa de 24 h ese día entre todas las obras y avisa (sin
      // bloquear) por encima de 12 h. Antes de escribir nada mira si algún día pisaría a gente ya
      // anotada, cae en fin de semana sin horario, aún no ha llegado o dejaría a alguien con 0 horas:
      // en ese caso NO guarda, enseña el aviso y espera la respuesta (decision = { modo, firma }, que
      // llega desde los botones del aviso). Con la respuesta de un aviso ya cambiado vuelve a avisar.
      function save(decision) {
        let presentes = a.list.filter((persona) => persona.on);
        if (!presentes.length) return guardarSinNadie(decision);
        let sinHoras = presentes.filter(
          (persona) => horarioDe(persona.nombre) === 0 && persona.horas === null,
        );
        if (sinHoras.length)
          return toast('Faltan las horas de: ' + sinHoras.map((persona) => persona.nombre).join(', '));

        let fechasAGuardar = (a.fechas && a.fechas.length) ? [...a.fechas] : [a.fecha];

          otras.delete(a.obra + '|' + a.amb + '|' + f);
          let anteriores = new Map();
          otras.forEach((personas, clave) => {

            personas.forEach((persona) =>
              anteriores.set(
                key(persona.nombre),
                R((anteriores.get(key(persona.nombre)) || 0) + persona.horas),
              ),
            );
          });
          let totalesDia = presentes.map((persona) => {
            let baseDia = horarioDe(persona.nombre, f);
            let horasPersona = R(persona.horas === null ? baseDia : persona.horas);
            return {
              nombre: persona.nombre,
              total: R((anteriores.get(key(persona.nombre)) || 0) + horasPersona),
              fecha: f,
            };

                  .map(

        let plan = planificarGuardado({ hoy: today(), dias: diasParaPlan(fechasAGuardar, presentes) });
        let modo = 'seguir';
        if (plan.hayAvisos) {
          if (!decision || decision.firma !== plan.firma) {
            a.guardado = null;
            a.aviso = { firma: plan.firma, plan, nombres: presentes.map((persona) => persona.nombre) };

        if (resultado.cancelado) {

          render();
          return toast('No se ha guardado nada.');
        }
        if (!resultado.guardar.length) {
          a.guardado = resumenDeGuardado(plan, resultado, presentes.map((persona) => persona.nombre));
          render();
          return toast('No se ha guardado ningún día: todos ya tenían gente.');
        }

        // 3. Guardar las jornadas de los días que toca
        resultado.guardar.forEach((f) => {
          let jornada = {
            obra: a.obra,
            ambito: a.amb,
            fecha: f,
            presentes: presentesDelDia(presentes, f),
            anulada: false,
            notas: '',
            registrado: new Date().toISOString(),

          pending.push(jornada);

        let ultimas = get(K.uh, {});
        presentes.forEach((persona) => {
          let baseDia = horarioDe(persona.nombre, a.fecha);
          let h = persona.horas === null ? baseDia : persona.horas;
          if (h > 0) ultimas[key(persona.nombre)] = h;
        });
        set(K.uh, ultimas);

        let guardada = set(K.p, pending);
        // Si hubo algún aviso de por medio, el resumen dice con exactitud qué días se han guardado, cuáles se
        // han sustituido (y quién estaba) y cuáles se han saltado.
        a.guardado =

            : null;
        render();

        if (!guardada)
          return toast(
            'No se pudo guardar en este aparato (¿navegación privada o memoria llena?). Envía ya ' +
              'la jornada al PC para no perder lo apuntado.',
          );

        // Sumar horas en todas las obras en la fecha principal para avisar si supera 12 h

              key(persona.nombre),
              R((anteriores.get(key(persona.nombre)) || 0) + persona.horas),
            ),
          );
        });
        let totales = presentes.map((persona) => {
          let baseDia = horarioDe(persona.nombre, a.fecha);
          let horasPersona = R(persona.horas === null ? baseDia : persona.horas);
          return {
            nombre: persona.nombre,
            total: R((anteriores.get(key(persona.nombre)) || 0) + horasPersona),
          };
        });
        let avisos = totales.filter((p) => p.total > 12);

        let aviso12h = avisos.map((p) => p.nombre + ' suma ' + N(p.total) + ' h ese día (todas las obras)').join('; ');
        if (plan.hayAvisos) {
          toast('Guardado. Mira abajo qué se ha guardado, sustituido o saltado.' + (aviso12h ? ' Aviso: ' + aviso12h : ''));
        } else if (fechasAGuardar.length > 1) {

              presentes.length +
              ' ' +

            'Jornada guardada. Aviso: ' +
              avisos
                .map(
                  (p) =>
                    p.nombre +
                    ' suma ' +
                    N(p.total) +
                    ' h ese día (todas las obras)',
                )
                .join('; '),
          );
        } else {
          toast('Jornada guardada en este aparato ✓');
        }
      }
      // ---------------------------------------------------------------------------
      // Enviar al PC: lo que hay sin enviar, el nombre del fichero y su descarga
      // ---------------------------------------------------------------------------
      // Nombre de una obra tal como lo limpia el generador de revisiones (safeRevisionWorkName):
      // mayúsculas, sin tildes y todo lo que no sea letra o número pasa a un espacio. Si no queda nada,
      // «OBRA».
      function nombreSeguro(valor) {

          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toUpperCase()

      function nombreFichero(id, dia = today()) {

      // Lo que una obra tiene sin enviar: sus jornadas (por fecha), si cambió el horario semanal y los

      function sinEnviarDe(id) {

          .filter((jornada) => jornada.obra === id)
          .sort((x, y) => x.fecha.localeCompare(y.fecha) || x.ambito.localeCompare(y.ambito));
        let horarioCambiado = JSON.stringify(hor(id)) !== JSON.stringify(base(id));

      function obrasConEnvio() {

        let ids = todas.filter((id) => id && hayQueEnviar(sinEnviarDe(id)));

        if (jornada.anulada) return donde + ' — jornada anulada (se quita del PC)';
        let horas = jornada.presentes.reduce((suma, persona) => suma + (+persona.horas || 0), 0);

      function contenidoEnLlano(datos) {

        let partes = [];
        if (datos.jornadas.length) partes.push(uno(datos.jornadas.length, 'jornada', 'jornadas'));
        if (datos.horarioCambiado) partes.push('el cambio del horario de la obra');
        if (especiales) partes.push(uno(especiales, 'horario especial', 'horarios especiales'));
        if (renombres.length) partes.push(uno(renombres.length, 'nombre corregido', 'nombres corregidos'));

        return (
          `<div class="envio" data-obra="${E(id)}"><h3>${E(nombreObra(id))}</h3><ul>${lineas.join('')}</ul>` +
          `<p class="nota">Se llamará «${E(nombreFichero(id))}»</p>` +
          `<button class="btn pri full" data-preparar="${E(id)}">Preparar el fichero para el PC</button>` +
          (compartirDisponible(id) ? `<button class="btn sec full" data-compartir="${E(id)}">Enviar con…</button>` : '') +

      // Bloque de los nombres corregidos y nuevos, que viajan dentro del fichero de cualquier obra.
      function envioNombresHTML() {

            .map((x) => (clean(x.empresa) ? '«' + x.nombre + '» → «' + x.empresa + '»' : '«' + x.nombre + '» sin empresa'))
            .join(', ');

      function enviarView() {

          : `<div class="aviso" id="nada-que-enviar">No hay nada por enviar: todas las jornadas ya están en el PC.</div>`;
        let listo = a.listo ? `<div class="listo" id="listo" role="status">${E(a.listo)}</div>` : '';
        if (a.compartirAviso) listo += `<div class="aviso" id="envio-fallo" role="status">${E(a.compartirAviso)}</div>`;
        return (
          `<div class="card" id="enviar"><h2>Enviar las jornadas al PC</h2>` +
          `<p id="para-que"><b>Para qué sirve:</b> la tablet apunta quién ha trabajado cada día, pero las ` +
          `cuentas (horas, días y % de cada uno), el panel de la obra, el informe y el ranking se hacen en ` +
          `el PC. Aquí preparas lo que has apuntado para llevárselo al PC. No se envía solo: si no lo ` +
          `llevas, el PC no se entera.</p>${contenido}${listo}${aparatoHTML()}` +
          `<p><b>Cómo sigue:</b></p><ol class="pasos" id="pasos">` +
          `<li>Se guarda un fichero llamado «CONTROL HORARIO», con el nombre de la obra y la fecha de ` +
          `hoy, en las descargas de este aparato.</li>` +
          `<li>Pásalo al PC como haces con las revisiones y déjalo en la carpeta REVISIONES de la obra.</li>` +
          `<li>En el PC, pídele a Claude «actualiza la obra» (o ejecuta el .bat).</li></ol>` +
          `<p class="nota" id="sigue-apuntado">Las jornadas siguen apuntadas aquí hasta que el PC las recibe y ` +
          `se publica: no hace falta volver a anotarlas.</p></div>`

      }
      // Nombre que lleva este aparato por defecto, según lo que es: «Tablet», «Móvil» o «PC».
      function aparatoPorDefecto() {
        // (Sin `navigator`, como en las pruebas que ejecutan el código fuera del navegador, no se sabe qué aparato es: «PC».)
        let agente = typeof navigator === 'object' && navigator && typeof navigator.userAgent === 'string' ? navigator.userAgent : '';
        if (/iPad/.test(agente) || (/Android/.test(agente) && !/Mobile/.test(agente))) return 'Tablet';
        if (/iPhone|Android/.test(agente)) return 'Móvil';

      function limpiarNombreAparato(texto) {

        return clean(sinRaros).slice(0, 30).trim();

      function nombreAparato() {

      // ---------------------------------------------------------------------------
      // Bandeja: todo lo que está sin enviar al PC, línea a línea, con «Quitar» en cada una. Quitar solo borra de
      // este aparato: no manda nada al PC ni cambia lo que el PC ya tiene. (Nace de dos casos reales del 05/11/2026:
      // jornadas apuntadas con nombres antiguos que nunca coinciden con lo del PC, y jornadas de garaje mal apuntadas.)
      // ---------------------------------------------------------------------------
      // Nombre actual de una persona si el PC la conoce con ese nombre o con uno anterior; si no, el nombre limpio.
      function nombreActualPC(nombre) {
        let clave = key(nombre);

          (c) => key(c.nombre) === clave || (c.nombres_anteriores || []).some((x) => key(x) === clave),
        );
        return persona ? persona.nombre : clean(nombre);
      }
      // ¿El PC ya tiene esta jornada igual (mismas personas, horas y extra)? Un nombre antiguo cuenta como el actual.
      // Una anulada coincide solo si el PC no tiene nada ese día.
      function elPCYaLaTiene(jornada) {
        let filas = rowsKey(jornada);
        if (jornada.anulada) return !filas.length;
        let sello = (nombre, p) => key(nombre) + '|' + +p.horas + '|' + +(p.extra || 0);
        let x = jornada.presentes.map((p) => sello(nombreActualPC(p.nombre), p)).sort();

      function quienLleva(nombre, contarNombresNuevos) {

        if (pending.some((j) => !j.anulada && j.presentes.some((p) => key(p.nombre) === clave)))
          return 'Lo lleva una jornada de la bandeja: quítala primero.';

          (personas) => objetoSimple(personas) && Object.keys(personas).some((n) => key(n) === clave),
        );
        if (enHorarios) return 'Lo lleva un horario especial de la bandeja: quítalo primero.';
        if (contarNombresNuevos && altas.some((x) => key(x) === clave))
          return 'Lo lleva un nombre nuevo de la bandeja: quítalo primero.';
        return '';
      }
      // Una línea de la bandeja con su botón «Quitar» (apagado, con el motivo, si quitarla dejaría algo a medias).
      function bandejaLinea(tipo, texto, atributos, motivoBloqueo = '') {
        return (
          `<li class="band-item" data-tipo="${tipo}"><span class="band-texto">${texto}</span>` +
          `<button class="btn ghost sm" data-quitar="${tipo}" ${atributos}${motivoBloqueo ? ' disabled' : ''}>Quitar</button>` +
          (motivoBloqueo ? `<p class="nota band-bloqueo">${E(motivoBloqueo)}</p>` : '') +
          `</li>`

      function obrasEnBandeja() {

      function bandejaObraHTML(id) {

        );

      }
      // Nombres corregidos, nombres nuevos y empresas apuntadas: no son de una obra, viajan en el fichero de cualquiera.
      function bandejaNombresHTML() {
        let lineas = [];
        renombres.forEach((c) =>
          lineas.push(
            bandejaLinea(
              'renombre',

      // Pestaña «Bandeja».
      function bandejaView() {

          `<p id="para-que-bandeja">Aquí ves todo lo que está sin enviar al PC. «Quitar» solo lo borra de este aparato: ` +

      // «Quitar» una línea de la bandeja. Lo que otra línea lleva no se quita a medias (el botón sale apagado; aquí se
      // vuelve a comprobar por si algo cambió desde que se pintó la pantalla).
      function quitarDeBandeja(tipo, d) {
        if (tipo === 'jornada') {
          pending = pending.filter((j) => jk(j) !== d.clave);
          set(K.p, pending);
        } else if (tipo === 'horario-obra') {
          delete hours[d.obra];
          set(K.h, hours);
        } else if (tipo === 'horario') {
          let personas = excepciones[d.obra];
          if (objetoSimple(personas)) {

            if (!Object.keys(personas).length) delete excepciones[d.obra];
          }
          set(K.x, excepciones);
        } else if (tipo === 'renombre') {
          if (quienLleva(d.a, true)) return render();
          renombres = renombres.filter((c) => !(c.de === d.de && c.a === d.a));
          set(K.rn, renombres);

          if (quienLleva(d.nombre, false)) return render();

          news = news.filter((x) => key(x) !== key(d.nombre));
          empresas = empresas.filter((x) => key(x.nombre) !== key(d.nombre));
          set(K.al, altas);
          set(K.n, news);
          set(K.em, empresas);
        } else if (tipo === 'empresa') {
          empresas = empresas.filter((x) => key(x.nombre) !== key(d.nombre));
          set(K.em, empresas);

        toast('Quitado de la bandeja. No se ha enviado nada.');

      // «Vaciar toda la bandeja» (ya confirmado): borra de este aparato todo lo que está sin enviar. No toca la lista de
      // trabajadores publicada, el borrador de la jornada en curso ni nada del PC.
      function vaciarBandeja() {
        pending = [];
        hours = {};
        excepciones = {};
        renombres = [];
        altas = [];
        empresas = [];
        news = [];
        set(K.p, pending);
        set(K.h, hours);
        set(K.x, excepciones);
        set(K.rn, renombres);
        set(K.al, altas);
        set(K.em, empresas);
        set(K.n, news);

      // Arma el contenido del fichero de una obra (mismo contrato de siempre): jornadas, horario
      // semanal si cambió, horarios especiales, nombres corregidos, nombres nuevos y empresas.
      function armarFichero(id) {
        let datos = sinEnviarDe(id);
        let horario = hor(id);
        let lote = { tipo: 'lote_personal', version: 1, obra: id, dispositivo: nombreAparato() };
        if (datos.horarioCambiado)
          lote.horario_semanal = {
            lun: horario[1],
            mar: horario[2],
            mie: horario[3],
            jue: horario[4],
            vie: horario[5],
            sab: horario[6],
            dom: horario[0],
          };
        if (Object.keys(datos.propios).length) lote.excepciones_horario = JSON.parse(JSON.stringify(datos.propios));
        if (renombres.length) lote.renombres = renombres.map((cambio) => ({ de: cambio.de, a: cambio.a }));
        let altasDelFichero = altas.concat(nuevasConEmpresa());
        if (altasDelFichero.length) lote.altas = altasDelFichero;
        if (empresas.length) lote.empresas = empresas.map((x) => ({ nombre: x.nombre, empresa: x.empresa }));
        lote.jornadas = datos.jornadas.map((jornada) => ({
          ambito: jornada.ambito,
          fecha: jornada.fecha,
          presentes: jornada.anulada
            ? []
            : jornada.presentes.map((persona) => ({
                nombre: persona.nombre,
                horas: persona.horas,
                extra: persona.extra,
              })),
          anulada: !!jornada.anulada,
          notas: jornada.notas || '',
          registrado: jornada.registrado,
        }));
        return { lote, nombre: nombreFichero(id), contenido: contenidoEnLlano(datos) };
      }
      // El fichero de una obra listo para llevarlo al PC, o null si esa obra no tiene nada que enviar.
      // Lo usan «Preparar el fichero para el PC» y «Enviar con…»: los dos parten del MISMO fichero.
      function ficheroParaEnviar(id) {
        if (!state.obras[id] && !pending.some((jornada) => jornada.obra === id)) return null;
        let fichero = armarFichero(id);
        return fichero.contenido ? fichero : null;
      }
      // Contenido del fichero tal como se escribe (descarga y «Enviar con…» lo sacan de aquí: no pueden diferir).
      function textoDelFichero(lote) {
        return JSON.stringify(lote, null, 1);
      }
      // «Preparar el fichero para el PC»: descarga el fichero de la obra y deja a la vista el recuadro
      // «Listo» con su nombre y lo que lleva.
      function prepararFichero(id) {
        let fichero = ficheroParaEnviar(id);
        if (!fichero) return;
        // Genera y dispara la descarga con un objeto Blob temporal
        let url = URL.createObjectURL(new Blob([textoDelFichero(fichero.lote)], { type: 'application/json' }));
        let enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = fichero.nombre + '.json';
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        a.compartirAviso = null;
        a.listo = `Listo. Se ha guardado el fichero «${fichero.nombre}» con ${fichero.contenido}. Ahora mándalo al PC.`;
        render();
      }
      // ---------------------------------------------------------------------------
      // «Enviar con…» (MA7): el MISMO fichero por la hoja de compartir del aparato (OneDrive, WhatsApp…).
      // Solo cambia cómo llega el fichero: mismo nombre, mismo contenido, mismo sitio de destino (la
      // carpeta REVISIONES de la obra). La descarga de siempre sigue ahí. Las cuatro funciones de abajo no
      // tocan la pantalla ni el reloj: se les pasa el navegador y la clase File (así se prueban solas).
      // ---------------------------------------------------------------------------
      // COMPARTIR: inicio
      // El fichero para la hoja de compartir: mismo nombre y mismo tipo que la descarga.
      function archivoParaCompartir(ClaseFile, nombre, texto) {
        return new ClaseFile([texto], nombre + '.json', { type: 'application/json' });
      }
      // ¿Sabe este aparato compartir ficheros? Sin soporte (o sin permiso) el botón no se enseña.
      function sabeCompartir(nav, ClaseFile, nombre) {
        try {
          if (!nav || typeof nav.share !== 'function' || typeof nav.canShare !== 'function') return false;
          return !!nav.canShare({ files: [archivoParaCompartir(ClaseFile, nombre, '{}')] });
        } catch (error) {
          return false;
        }
      }
      // Comparte el fichero con la hoja del sistema. NUNCA lanza: devuelve el resultado.
      //   'compartido'  eligió dónde mandarlo
      //   'cancelado'   cerró la hoja sin elegir (no es un fallo)
      //   'denegado'    el aparato no deja compartir este fichero (Chrome no admite el tipo .json)
      //   'sin_soporte' no sabe compartir ficheros
      //   'error'       cualquier otra cosa
      // OJO: hay que llamarla directamente desde el toque del dedo (el navegador no abre la hoja si no).
      async function compartirFichero(nav, ClaseFile, nombre, texto) {
        let datos;
        try {
          if (!nav || typeof nav.share !== 'function' || typeof nav.canShare !== 'function') return { resultado: 'sin_soporte' };
          datos = { files: [archivoParaCompartir(ClaseFile, nombre, texto)] };
          if (!nav.canShare(datos)) return { resultado: 'sin_soporte' };
        } catch (error) {
          return { resultado: 'sin_soporte' };
        }
        try {
          await nav.share(datos);
          return { resultado: 'compartido' };
        } catch (error) {
          let nombreError = error && error.name;
          if (nombreError === 'AbortError') return { resultado: 'cancelado' };
          if (nombreError === 'NotAllowedError') return { resultado: 'denegado' };
          return { resultado: 'error' };
        }
      }
      // COMPARTIR: fin
      const COMP = {
        vias:
          'Hay dos maneras de llevar el fichero al PC. «Preparar el fichero para el PC» lo guarda en las ' +
          'descargas de este aparato (los pasos de abajo). «Enviar con…» abre la lista de aplicaciones de ' +
          'este aparato: elige OneDrive (o la que uses para pasar cosas al PC) y la carpeta REVISIONES de la ' +
          'obra. Es el mismo fichero en las dos.',
        listo:
          'Listo. Has pasado el fichero «{nombre}» con {contenido} a la aplicación que has elegido. ' +
          'Comprueba que ha llegado a la carpeta REVISIONES de la obra.',
        denegado:
          'Este aparato no deja pasar este fichero con «Enviar con…». Usa «Preparar el fichero para el PC»: ' +
          'guarda el mismo fichero y no se pierde nada.',
        error:
          'No se ha podido abrir «Enviar con…». Vuelve a probar o usa «Preparar el fichero para el PC»: ' +
          'guarda el mismo fichero y no se pierde nada.',
      };
      // Si el aparato rechazó el fichero, el botón se esconde en ese aparato durante 30 días (luego vuelve a
      // probar: el navegador puede haber cambiado). Se guarda el día del rechazo.
      function compartirRechazado() {
        let rechazo = get(K.cn, null);
        return !!(rechazo && /^\d{4}-\d{2}-\d{2}$/.test(rechazo.desde) && today() <= add(rechazo.desde, 30));
      }
      // El navegador y la clase File de este aparato (null si no existen: así nada revienta donde no los hay).
      function elAparato() {
        return { nav: typeof navigator === 'undefined' ? null : navigator, ClaseFile: typeof File === 'undefined' ? null : File };
      }
      // ¿Se enseña «Enviar con…» en la obra id? Solo si el aparato sabe y no ha rechazado ya el fichero.
      function compartirDisponible(id) {
        let aparato = elAparato();
        return !compartirRechazado() && sabeCompartir(aparato.nav, aparato.ClaseFile, nombreFichero(id));
      }
      // Hay un «Enviar con…» en marcha (la hoja del sistema abierta): un segundo toque no abre otra.
      let compartiendo = false;
      // «Enviar con…» de una obra. Cualquier otra cosa que el toque se hace antes de llamar a la hoja.
      async function compartirObra(id) {
        if (compartiendo) return;
        let fichero = ficheroParaEnviar(id);
        if (!fichero) return;
        compartiendo = true;
        let respuesta;
        let aparato = elAparato();
        try {
          respuesta = await compartirFichero(aparato.nav, aparato.ClaseFile, fichero.nombre, textoDelFichero(fichero.lote));
        } finally {
          compartiendo = false;
        }
        let resultado = respuesta.resultado;
        if (resultado === 'cancelado') return;
        if (resultado === 'compartido') {
          a.compartirAviso = null;
          a.listo = COMP.listo.replace('{nombre}', fichero.nombre).replace('{contenido}', fichero.contenido);
        } else {
          if (resultado === 'denegado' || resultado === 'sin_soporte') set(K.cn, { desde: today() });
          a.compartirAviso = resultado === 'error' ? COMP.error : COMP.denegado;
        }

      }
      // ---------------------------------------------------------------------------
      // Eventos: manejadores de click, change e input de la interfaz de usuario
      // ---------------------------------------------------------------------------
      document.addEventListener('click', (evento) => {

        if (!boton) return;

        if (datos.v) {

          render();

        if (datos.quitar) return quitarDeBandeja(datos.quitar, datos);
        if (datos.vaciar !== undefined) {
          a.vaciar = true;
          render();
          return;
        }
        if (datos.vaciarNo !== undefined) {
          a.vaciar = false;
          render();
          return;
        }
        if (datos.vaciarSi !== undefined) return vaciarBandeja();

        // de Safari

          set(K.a, true);

          return;

        if (datos.amb) {
          a.amb = datos.amb;
          changed();
          return;
        }
        // Copiar a la lista la gente del último día anotado (se repasa y se quita a quien no haya venido)
        if (datos.copiarUltimo !== undefined) {
